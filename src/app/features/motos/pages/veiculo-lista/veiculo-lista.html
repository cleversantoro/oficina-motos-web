<section class="lista-shell">
  <header class="lista-header">
    <div class="header-title">
      <h1>Veículos</h1>
      <span class="count-pill">{{ tableRows().length }} registros</span>
    </div>
    <div class="header-actions">
      @if (canCreateVeiculo()) {
        <a routerLink="/motos/novo">
          <button class="btn-primary" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nova Moto
          </button>
        </a>
      }
    </div>
  </header>

  @if (!loading() && error()) {
    <div class="state-card error" role="alert">
      <p>{{ error() }}</p>
      <button type="button" class="btn-ghost" (click)="load()">Tentar novamente</button>
    </div>
  } @else {
    <app-datatable
      #dt
      [data]="tableRows()"
      [columns]="columns()"
      [actions]="actions"
      [loading]="loading()"
      [selectable]="canDeleteVeiculo()"
      [exportable]="true"
      statusField="statusLabel"
      [statusOptions]="statusOptions"
      searchPlaceholder="Buscar por placa, marca, modelo, cor..."
      emptyTitle="Nenhum veículo encontrado"
      emptyDescription="Não encontramos veículos correspondentes aos filtros atuais."
      (rowClick)="openDetalhe($event.id)"
      (bulkDelete)="confirmBulkDelete($event)"
    />
  }

  <ng-template #placaTpl let-row>
    <span class="placa-pill">{{ row.placa }}</span>
    @if (row.principal) {
      <span class="badge-principal">Principal</span>
    }
  </ng-template>

  <ng-template #modeloTpl let-row>
    <div class="modelo-cell">
      <span class="marca-nome">{{ row.marca }}</span>
      <span class="modelo-nome">{{ row.modelo }}</span>
    </div>
  </ng-template>

  <ng-template #corTpl let-row>
    <div class="cor-cell">
      <span class="cor-dot" [style.background]="row.corHex" aria-hidden="true"></span>
      <span>{{ row.cor }}</span>
    </div>
  </ng-template>

  <app-confirm-modal
    [isOpen]="mostrarModal"
    message="Deseja realmente apagar este registro?"
    (confirm)="executarExclusao()"
    (cancel)="fecharModal()">
  </app-confirm-modal>
</section>
