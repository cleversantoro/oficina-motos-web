<div class="login-bg">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="login-card glass-panel">
    <div class="brand">
      <div class="brand-mark">OM</div>
      <div>
        <p class="brand-title">Oficina MotoPro</p>
        <p class="brand-subtitle">Acesse o painel operacional</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email"
          class="p-inputtext w-full"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <small class="field-error">Informe um e-mail válido.</small>
        }
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="password-wrap" style="position: relative; display: flex; align-items: center;">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="p-inputtext w-full"
          />
          <button
            type="button"
            aria-label="Alternar visibilidade da senha"
            style="position: absolute; right: 0.75rem; background: transparent; border: none; color: #94a3b8; cursor: pointer;"
            (click)="showPassword.set(!showPassword())"
          >
            <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <small class="field-error">Senha obrigatória.</small>
        }
      </div>

      @if (errorMessage()) {
        <div class="alert-error" role="alert">
          <span class="fa-solid fa-triangle-exclamation"></span>
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        class="p-button login-btn w-full"
        [disabled]="loading()"
      >
        <i class="fa-solid" [class.fa-right-to-bracket]="!loading()" [class.fa-spin]="loading()" [class.fa-spinner]="loading()"></i>
        <span>Entrar</span>
      </button>
    </form>
  </div>
</div>
