<div class="login-bg">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="login-card glass-panel">
    <div class="brand">
      <div class="brand-mark">OM</div>
      <div>
        <p class="brand-title">Oficina MotoPro</p>
        <p class="brand-subtitle">Acesse o painel operacional</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>

      <div class="field">
        <label for="email">E-mail</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email"
          class="w-full"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <small class="field-error">Informe um e-mail válido.</small>
        }
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <p-password
          inputId="password"
          formControlName="password"
          placeholder="••••••••"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <small class="field-error">Senha obrigatória.</small>
        }
      </div>

      @if (errorMessage()) {
        <div class="alert-error" role="alert">
          <span class="pi pi-exclamation-triangle"></span>
          {{ errorMessage() }}
        </div>
      }

      <p-button
        type="submit"
        label="Entrar"
        icon="pi pi-sign-in"
        [loading]="loading()"
        styleClass="login-btn w-full"
      />

    </form>
  </div>
</div>
