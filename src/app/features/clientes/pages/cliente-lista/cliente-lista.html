<div class="p-6 max-w-7xl mx-auto">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-slate-800">Gestão de Clientes</h1>
    <p-button label="Novo Cliente" icon="pi pi-plus" size="small"></p-button>
  </div>

  <div class="card bg-white p-4 rounded-lg shadow-sm border border-slate-200">
    <p-table [value]="clientes" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Email</th>
          <th>Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-cliente>
        <tr>
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.cpf }}</td>
          <td>{{ cliente.email }}</td>
          <td>
            <p-button icon="pi pi-pencil" [text]="true" severity="secondary"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
