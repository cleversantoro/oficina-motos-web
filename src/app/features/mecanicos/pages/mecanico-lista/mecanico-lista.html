<section class="mec-shell">
  <header class="lista-header">
    <div class="header-title">
      <h1>Mecânicos</h1>
      <span class="count-pill">{{ filtered.length }} registros</span>
    </div>
    <div class="header-actions">
      @if (canCreateMecanico()) {
        <button class="btn-cta" routerLink="/mecanicos/novo">+ Novo Mecânico</button>
      }
    </div>
  </header>

  <app-datatable
    [data]="filtered"
    [columns]="columns"
    [loading]="loading"
    [selectable]="canDeleteMecanico()"
    [exportable]="true"
    searchPlaceholder="Buscar por nome, nível, status..."
    emptyTitle="Nenhum mecânico encontrado"
    emptyDescription="Não encontramos mecânicos correspondentes aos filtros aplicados."
  />

  <ng-template #nomeTpl let-m>
    <div class="nome-cell">
      <span class="avatar">{{ (m.nome ?? '?')[0] }}</span>
      <div>
        <a class="name name-link" [routerLink]="['/mecanicos', m.id]">{{ m.nome }} {{ m.sobrenome }}</a>
        <p class="sub">{{ m.nivel }}</p>
      </div>
    </div>
  </ng-template>

  <ng-template #statusTpl let-m>
    <span class="status-pill" [class.ativo]="m.status === 'ATIVO'" [class.inativo]="m.status !== 'ATIVO'">
      {{ m.status ?? '—' }}
    </span>
  </ng-template>

  <ng-template #valorHoraTpl let-m>
    {{ m.valorHora !== null && m.valorHora !== undefined ? 'R$ ' + m.valorHora.toFixed(2) : '—' }}
  </ng-template>

  <ng-template #acoesTpl let-m>
    <div class="action-cell">
      <a
        class="icon-btn view-btn"
        [routerLink]="['/mecanicos', m.id]"
        (click)="openDetails(m); $event.stopPropagation()"
        title="Visualizar"
      >
        <i class="fa-solid fa-eye" aria-hidden="true"></i>
      </a>
      @if (canDeleteMecanico()) {
        <button
          type="button"
          class="icon-btn delete-btn"
          (click)="confirmDelete(m.id); $event.stopPropagation()"
          title="Excluir"
        >
          <i class="fa-solid fa-trash" aria-hidden="true"></i>
        </button>
      }
    </div>
  </ng-template>

  <app-mecanico-detalhe
    [mecanico]="selected"
    [visible]="!!selected"
    (closed)="closeDetails()"
  />
</section>
