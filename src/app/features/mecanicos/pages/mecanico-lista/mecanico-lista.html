<section class="mec-shell">
  <header class="page-header">
    <div class="header-actions">
      <p-button label="Novo Mecânico" icon="pi pi-plus" size="small"></p-button>
    </div>
  </header>

  <div class="table-card card-surface">
    <div class="table-head">
      <div>
        <p class="eyebrow">Listagem</p>
        <h2>Mecânicos</h2>
      </div>
    </div>

    <p-table [value]="mecanicos" [loading]="loading" [tableStyle]="{ 'min-width': '50rem' }"
      [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [showCurrentPageReport]="true"
      currentPageReportTemplate="Exibindo {first} até {last} de {totalRecords} registros">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Nível</th>
          <th>Status</th>
          <th>Documento</th>
          <th>Valor/Hora</th>
          <th class="text-right">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-mec>
        <tr>
          <td>
            <div class="nome">
              <span class="avatar-initial">{{ mec.nome[0] }}</span>
              <div>
                <p class="name">{{ mec.nome }} {{ mec.sobrenome }}</p>
                <p class="sub">{{ mec.nivel }}</p>
              </div>
            </div>
          </td>
          <td>{{ mec.nivel }}</td>
          <td>{{ mec.status }}</td>
          <td>{{ mec.documentoPrincipal }}</td>
          <td>R$ {{ mec.valorHora?.toFixed(2) }}</td>
          <td class="text-right">
            <p-button icon="pi pi-search" severity="info" (onClick)="openDetails(mec)" rounded></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <app-mecanico-detalhe
    [mecanico]="selected"
    [visible]="selected !== null"
    (closed)="closeDetails()">
  </app-mecanico-detalhe>

</section>
