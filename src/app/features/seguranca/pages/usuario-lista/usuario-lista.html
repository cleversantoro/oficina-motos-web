<section class="seguranca-shell">
  <header class="page-header">
    <div>
      <h1>Gerenciamento de Usuários</h1>
      <p class="subtitle">Administre contas de acesso, perfis vinculados e status dos usuários.</p>
    </div>

    <div class="header-actions">
      <a routerLink="/seguranca/perfis" class="p-button p-button-outlined p-button-sm nav-btn">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        <span>Perfis de Acesso</span>
      </a>
      <a routerLink="/seguranca/usuarios/novo" class="p-button p-button-primary p-button-sm nav-btn" data-testid="btn-novo-usuario">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>Novo Usuário</span>
      </a>
    </div>
  </header>

  @if (error(); as message) {
    <div class="state-box error" role="alert">
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
      <p>{{ message }}</p>
      <button pButton type="button" label="Tentar novamente" class="p-button-outlined p-button-sm" (click)="carregarUsuarios()"></button>
    </div>
  } @else {
    <app-datatable
      [data]="tableRows()"
      [columns]="columns"
      [loading]="loading()"
      [selectable]="false"
      [exportable]="true"
      statusField="statusDescricao"
      [statusOptions]="statusOptions"
      searchPlaceholder="Buscar por nome, login, e-mail ou perfil..."
      emptyTitle="Nenhum usuário encontrado."
      emptyDescription="Não encontramos usuários correspondentes aos filtros atuais."
    />
  }

  <ng-template #loginTpl let-usuario>
    <code>{{ usuario.login }}</code>
  </ng-template>

  <ng-template #statusTpl let-usuario>
    <p-tag [value]="usuario.statusDescricao || 'Ativo'" [severity]="getStatusSeverity(usuario.status)"></p-tag>
  </ng-template>

  <ng-template #ultimoLoginTpl let-usuario>
    {{ usuario.ultimoLogin ? (usuario.ultimoLogin | date: 'dd/MM/yyyy HH:mm') : 'Nunca' }}
  </ng-template>

  <ng-template #acoesTpl let-usuario>
    <div class="actions-col">
      <a
        [routerLink]="['/seguranca/usuarios', usuario.id, 'editar']"
        class="p-button p-button-text p-button-sm"
        title="Editar usuário"
      >
        <i class="fa-solid fa-pencil" aria-hidden="true"></i>
      </a>
      <button
        pButton
        type="button"
        icon="fa-solid fa-trash"
        class="p-button-text p-button-danger p-button-sm"
        title="Excluir usuário"
        [disabled]="deletingId() === usuario.id"
        [loading]="deletingId() === usuario.id"
        (click)="confirmarExclusao(usuario)"
      ></button>
    </div>
  </ng-template>
</section>
