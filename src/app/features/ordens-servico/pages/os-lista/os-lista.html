<section class="os-shell">
  <header class="lista-header">
    <div>
      <p class="eyebrow">Ordem de Serviço</p>
      <h1>Ordens de Serviço</h1>
      <p class="muted">Consulte atendimentos, status e responsáveis.</p>
    </div>

    @if (canCreateOrdem()) {
      <button pButton type="button" icon="fa-solid fa-plus" label="Nova OS" class="btn-cta" (click)="openNew()"></button>
    }
  </header>

  @if (error(); as message) {
    <div class="state-card state-error" role="alert">
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
      <span>{{ message }}</span>
      <button pButton type="button" label="Tentar novamente" class="p-button-outlined" (click)="fetchOrdens()"></button>
    </div>
  } @else {
    <app-datatable
      #dt
      [data]="tableRows()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      [selectable]="canDeleteOrdem()"
      [exportable]="true"
      statusField="status"
      [statusOptions]="statusOptions"
      searchPlaceholder="Buscar por ID, status, cliente..."
      emptyTitle="Nenhuma ordem de serviço encontrada"
      emptyDescription="Não encontramos ordens de serviço correspondentes aos filtros atuais."
      (rowClick)="openDetails($event)"
      (bulkDelete)="confirmBulkDelete($event)"
    />
  }
</section>
