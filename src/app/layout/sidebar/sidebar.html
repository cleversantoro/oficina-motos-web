<aside class="sidebar" [class.open]="isOpen()" aria-label="Menu principal">
  <div class="drawer-head">
    <span class="drawer-title">Navegação</span>
    <button
      #closeBtn
      type="button"
      class="drawer-close"
      aria-label="Fechar menu"
      (click)="onNavigate()"
    >
      <span class="fa-solid fa-xmark" aria-hidden="true"></span>
    </button>
  </div>

  <nav class="nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-link"
        (click)="onNavigate()"
      >
        <span class="fa-solid" [class]="item.icon" aria-hidden="true"></span>
        <div class="nav-copy">
          <span class="label">{{ item.label }}</span>
          <small class="hint">{{ item.hint }}</small>
        </div>
        <span class="caret fa-solid fa-chevron-right" aria-hidden="true"></span>
      </a>
    }
  </nav>
</aside>
