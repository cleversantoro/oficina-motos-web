<div class="layout-bg">
  <div class="shape shape-1" aria-hidden="true"></div>
  <div class="shape shape-2" aria-hidden="true"></div>

  <div class="layout-shell">
    <app-header [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()"></app-header>

    @if (menuOpen()) {
      <div class="sidebar-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
    }

    <div class="layout-grid">
      <app-sidebar [isOpen]="menuOpen()" (navigate)="closeMenu()"></app-sidebar>
      <main class="main-slot">
        <div class="main-panel glass-panel">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    <app-footer></app-footer>
  </div>

  <!-- Toast para notificações globais -->
  <app-toast></app-toast>

  <!-- Loading overlay global -->
  <app-loading-spinner></app-loading-spinner>

  <!-- Dialog de confirmação global -->
  <app-confirm-modal
    [isOpen]="!!confirmation.activeDialog()"
    [title]="confirmation.activeDialog()?.header || 'Confirmar Exclusão'"
    [message]="confirmation.activeDialog()?.message || 'Tem certeza que deseja excluir este item?'"
    [confirmLabel]="confirmation.activeDialog()?.acceptLabel || 'Excluir'"
    [cancelLabel]="confirmation.activeDialog()?.rejectLabel || 'Cancelar'"
    (confirm)="confirmation.accept()"
    (cancel)="confirmation.reject()">
  </app-confirm-modal>
</div>
