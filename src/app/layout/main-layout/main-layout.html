<div class="layout-bg">
  <div class="shape shape-1" aria-hidden="true"></div>
  <div class="shape shape-2" aria-hidden="true"></div>

  <div class="layout-shell">
    <app-header [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()"></app-header>

    @if (menuOpen()) {
      <div class="sidebar-backdrop" (click)="closeMenu()" aria-hidden="true"></div>
    }

    <div class="layout-grid">
      <app-sidebar [isOpen]="menuOpen()" (navigate)="closeMenu()"></app-sidebar>
      <main class="main-slot">
        <div class="main-panel glass-panel">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast para notificações globais -->
  <app-toast></app-toast>

  <!-- Loading overlay global -->
  <app-loading-spinner></app-loading-spinner>

  <!-- Dialog de confirmação global -->
  @if (confirmation.activeDialog(); as dlg) {
    <div class="confirm-backdrop" role="dialog" aria-modal="true" [attr.aria-label]="dlg.header">
      <div class="confirm-dialog">
        <div class="confirm-header">
          <i [class]="dlg.icon" aria-hidden="true"></i>
          <h3>{{ dlg.header }}</h3>
        </div>
        <p class="confirm-message">{{ dlg.message }}</p>
        <div class="confirm-actions">
          <button type="button" class="confirm-btn confirm-reject" (click)="confirmation.reject()">
            {{ dlg.rejectLabel }}
          </button>
          <button type="button" class="confirm-btn confirm-accept" (click)="confirmation.accept()">
            {{ dlg.acceptLabel }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
