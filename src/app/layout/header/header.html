<header class="header-shell">
  <div class="brand">
    <div class="brand-mark">OM</div>
    <div>
      <p class="brand-title">Oficina MotoPro</p>
      <p class="brand-subtitle">Painel operacional</p>
    </div>
  </div>

  <div class="header-actions">
    <div class="search">
      <span class="pi pi-search"></span>
      <input
        type="text"
        placeholder="Buscar por cliente, placa ou OS"
        aria-label="Buscar por cliente, placa ou OS"
      />
    </div>
    <button class="cta strong">
      <span class="pi pi-bolt"></span>
      Nova OS
    </button>
    <button class="cta ghost" aria-label="Sincronizar">
      <span class="pi pi-refresh"></span>
    </button>
    <div class="avatar">CL</div>
  </div>
</header>
