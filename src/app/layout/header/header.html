<header class="header-shell">
  <div class="brand">
    <div class="brand-mark">OM</div>
    <div>
      <p class="brand-title">Oficina MotoPro</p>
      <p class="brand-subtitle">Painel operacional</p>
    </div>
  </div>

  <div class="header-actions">
    <div class="search">
      <span class="pi pi-search"></span>
      <input
        type="text"
        placeholder="Buscar por cliente, placa ou OS"
        aria-label="Buscar por cliente, placa ou OS"
      />
    </div>
    <button class="cta strong">
      <span class="pi pi-bolt"></span>
      Nova OS
    </button>
    <button class="cta ghost" aria-label="Sincronizar">
      <span class="pi pi-refresh"></span>
    </button>

    @if (currentUser(); as user) {
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    }

    <div class="avatar" [title]="currentUser()?.name ?? ''">
      {{ initials() }}
    </div>

    <button class="cta ghost logout-btn" (click)="logout()" aria-label="Sair">
      <span class="pi pi-sign-out"></span>
    </button>
  </div>
</header>
